# surikat: status of your Claude Code sessions in tmux.
# Sourced from ~/.tmux.conf by install.sh (`source-file -q ~/.tmux/surikat.conf`).

# Icons in the window list and a summary in status-right (idempotent).
run-shell "~/.local/bin/surikat-tmux"

# prefix C: dashboard popup (replaces the default customize-mode).
bind C display-popup -E -w 85% -h 80% "~/.local/bin/surikat"

# prefix N / P: next waiting session, and back along the trail.
bind N run-shell -b "~/.local/bin/surikat --next --client '#{client_name}'"
bind P run-shell -b "~/.local/bin/surikat --back --client '#{client_name}'"

# prefix T: choose-tree with icons and ★/↓ marks (prefix w stays the stock tree).
bind T choose-tree -Zw -F "#{?pane_format,#{E:@surikat_tree_pane_icon}#{pane_current_command}  #{pane_current_path},#{?window_format,#{E:@surikat_tree_window_icons}#{window_name}#{window_flags},#{session_windows} windows#{?session_attached, (attached),}}}"
